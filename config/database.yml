default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

taco_catalog: &taco_catalog
  adapter: sqlite3
  database: <%= Rails.root.join("db/catalog/taco.sqlite3") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  flags: 1
  database_tasks: false
  pragmas:
    journal_mode: delete
    query_only: true

development:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL_FINANCIAL_MANAGER"] %>
  taco:
    <<: *taco_catalog

test:
  primary:
    <<: *default
    username: <%= ENV["TEST_USERNAME"] %>
    host: <%= ENV["TEST_HOST"] %>
    password: <%= ENV["TEST_PASSWORD"] %>
    port: <%= ENV["TEST_PORT"] %>
    database: financial_manager_test
  taco:
    <<: *taco_catalog

production:
  taco:
    <<: *taco_catalog
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL_FINANCIAL_MANAGER"] %>

  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL_FINANCIAL_MANAGER"] %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL_FINANCIAL_MANAGER"] %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL_FINANCIAL_MANAGER"] %>
    migrations_paths: db/cable_migrate
